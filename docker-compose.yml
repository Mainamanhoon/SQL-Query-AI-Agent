services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-2}
      QUERY_ROW_LIMIT: ${QUERY_ROW_LIMIT:-200}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:-sqlite:////app/chat-data/chat_sessions.db}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - chat_data:/app/chat-data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  chat_data:
